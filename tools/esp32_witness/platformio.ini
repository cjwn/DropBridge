[platformio]
; Keep build artifacts out of the source tree and inside the repo's ignored build/.
build_dir = ../../build/esp32_witness

[env:esp32-s3-devkitc-1]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -DCORE_DEBUG_LEVEL=0
